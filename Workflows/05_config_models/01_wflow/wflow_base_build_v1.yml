# Wflow base build configuration — HydroMT v1 / hydromt_wflow 1.0.x (WflowSbmModel).
# Migrated from wflow_base_build.yml (v0 setup_* dict format) using the official
# migration_ref_files/wflow_build.yml template. The build script (setup_wflow_base.py)
# injects region (from the SFINCS region geojson) and river_upa at runtime.
modeltype: wflow_sbm

global:
  data_libs: []   # provided at runtime by the build script (data_cat)

steps:
  - setup_basemaps:
      hydrography_fn: merit_hydro
      basin_index_fn: merit_hydro_index
      upscale_method: ihu
      res: 0.00833333
      region: {}              # injected by the script: {"basin": region}

  - setup_rivers:
      hydrography_fn: merit_hydro
      river_geom_fn: rivers_lin2019_v1
      rivdph_method: powlaw
      min_rivdph: 1
      min_rivwth: 30
      slope_len: 2000
      smooth_len: 5000
      river_routing: local_inertial   # was 'local-inertial' (hyphen) in v0
      # the script sets river_upa: <river_upa>

  - setup_river_roughness:           # split out of setup_rivers in v1 (manning n)

  - setup_floodplains:
      hydrography_fn: merit_hydro
      floodplain_type: 1d

  - setup_reservoirs_simple_control:  # was setup_reservoirs
      reservoirs_fn: hydro_reservoirs
      timeseries_fn: gww
      min_area: 1.0

  - setup_reservoirs_no_control:      # was setup_lakes (lakes_fn -> reservoirs_fn)
      reservoirs_fn: hydro_lakes
      min_area: 10.0

  - setup_glaciers:
      glaciers_fn: rgi
      min_area: 1.0

  - setup_lulcmaps:
      lulc_fn: vito

  - setup_laimaps:
      lai_fn: modis_lai

  - setup_soilmaps:
      soil_fn: soilgrids
      ptf_ksatver: brakensiek

  - setup_outlets:
      river_only: True

  - setup_config_output_timeseries:
      mapname: wflow_gauges_locs
      toml_output: netcdf
      header: ["Q"]
      param: ["river_water__volume_flow_rate"]   # was lateral.river.q_av (wflow.jl v1 name)

  - setup_constant_pars:              # v1 uses Wflow.jl variable names (see ref template)
      snowpack__degree_day_coefficient: 3.75653                                   # Cfmax
      soil_surface_water__infiltration_reduction_parameter: 0.038                 # cf_soil
      vegetation_canopy_water__mean_evaporation_to_mean_precipitation_ratio: 0.11 # EoverR
      compacted_soil_surface_water__infiltration_capacity: 5                      # InfiltCapPath
      soil_water_saturated_zone_bottom__max_leakage_volume_flux: 0                # MaxLeakage
      soil_wet_root__sigmoid_function_shape_parameter: -500                       # rootdistpar
      atmosphere_air__snowfall_temperature_threshold: 0                           # TT
      atmosphere_air__snowfall_temperature_interval: 2                            # TTI
      snowpack__melting_temperature_threshold: 0                                  # TTM
      snowpack__liquid_water_holding_capacity: 0.1                                # WHC
      glacier_ice__degree_day_coefficient: 5.3                                    # G_Cfmax
      glacier_firn_accumulation__snowpack_dry_snow_leq_depth_fraction: 0.002      # G_SIfrac
      glacier_ice__melting_temperature_threshold: 1.3                             # G_TT
      # TODO: v0 also set InfiltCapSoil=600 and soilthickness=4000 as constant_pars.
      # These have no entry in the official v1 template — confirm the Wflow.jl v1
      # variable names (or whether they are now staticmaps) before re-adding.

  - setup_ksathorfrac:
      ksat_fn: ksathorfrac_global
      variable: RF_250_KsatHorFrac_global
