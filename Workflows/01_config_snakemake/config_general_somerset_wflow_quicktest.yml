# Somerset quick SFINCS+Wflow test (CF0) — validates the wflow/Julia run + the wflow->SFINCS
# discharge coupling end-to-end on HydroMT v1. 1-day event window for speed (warmup is 1 yr).
# Separate runname (SomersetLevels_wqt). use_bankfull_corr=False (the bankfull correction is a
# deferred honduras-v1 feature; the raw wflow discharge is coupled).
root_dir:    11210471-001-compass
dir_data:    01_Data
dir_models:  02_Models
dir_runs:    03_Runs

runname_ids:
    SomersetLevels_wqt:
        tc_name: winterstorm
        region: somerset
        start_time: 20140101 000000
        end_time: 20140102 000000                           # 1-day event for a quick test
        precip_forcing: ceh_gear
        meteo_forcing: era5_daily
        wind_forcing: era5_hourly
        bathy: gebco
        river_upa: 5
        use_dfm: False
        use_waves: False
        skip_coastal_forcing: True
        skip_discharge_forcing: True
        use_wflow: True
        use_bankfull_corr: False
        dfm_res: '100'
        dfm_coastal_mask: coastal_coupling_msk_SMST
        dfm_obs_file: coastal_coupling_DFM_obs_points_SMST
        dfm_verification_points: dfm_verif_points_SMST
        tidemodel: GTSMv41opendap
        coastal_ts: gtsm_codec_reanalysis
        config_sfincs_base: sfincs_base_build_v1.yml
        config_wflow_base: wflow_base_build_v1.yml
        sfincs_obs_file: obs_locs_somerset.geojson
        bbox_sfincs: "[-3.16169,51.06687,-2.867119,51.258058]"
        utmzone: 30u
        CF_value_rain: [0]
        CF_value_wind: [0]
        CF_value_SLR: [0]
