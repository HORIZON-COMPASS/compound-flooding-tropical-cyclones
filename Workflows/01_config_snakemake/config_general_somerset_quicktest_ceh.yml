# Somerset quick end-to-end test using the local CEH-GEAR-1hr-v2 forcing (ceh_gear_compass).
# precip-only SFINCS (no wflow), CF0, 3-hour window in Dec 2013 (the only month the CEH data
# currently covers). Separate runname (SomersetLevels_qt_ceh) so nothing is overwritten.
root_dir:    11210471-001-compass
dir_data:    01_Data
dir_models:  02_Models
dir_runs:    03_Runs
runname_ids:
    SomersetLevels_qt_ceh:
        tc_name: winterstorm
        region: somerset
        CF_landuse: [vito]                                  # land-use scenarios; model/run dirs are suffixed with this
        use_bankfull_corr: False                            # bankfull correction needs a separate 30-yr wflow run
        start_time: 20131220 000000                      # 3-hour window within the Dec-2013 CEH data
        end_time: 20131220 030000
        precip_forcing: ceh_gear_compass                  # local CEH-GEAR-1hr-v2 hourly rainfall
        wind_forcing: no_wind
        bathy: gebco
        river_upa: 5
        use_dfm: False
        use_wflow: False
        skip_coastal_forcing: True
        skip_discharge_forcing: True
        config_sfincs_base: sfincs_base_build_v1.yml
        sfincs_obs_file: obs_locs_somerset.geojson        # absent -> obs points skipped
        bbox_sfincs: "[-3.16169,51.06687,-2.867119,51.258058]"
        dfm_coastal_mask: coastal_coupling_msk_SMST
        utmzone: 30u
        CF_value_rain: [0]
        CF_value_wind: [0]
        CF_value_SLR: [0]
        tidemodel: GTSMv41opendap
        coastal_ts: gtsm_codec_reanalysis
        dfm_res: '100'
