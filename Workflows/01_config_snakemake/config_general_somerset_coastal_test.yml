# Somerset FULL compound test on HydroMT v1: coastal (local GTSM-ERA5) + precip + Wflow + SFINCS.
# CF0. 3-day March-2019 window because the local GTSM-ERA5 water level only covers 2019 onward
# (the real 2013/14 coastal data will come from Azure). Separate runname (SomersetLevels_coastal).
root_dir:    11210471-001-compass
dir_data:    01_Data
dir_models:  02_Models
dir_runs:    03_Runs

runname_ids:
    SomersetLevels_coastal:
        tc_name: winterstorm
        region: somerset
        CF_landuse: [vito]                                  # land-use scenarios; model/run dirs are suffixed with this
        start_time: 20190315 000000                         # March 2019 (local GTSM coverage)
        end_time: 20190318 000000                           # 3-day window
        precip_forcing: era5_hourly
        meteo_forcing: era5_daily                           # wflow temp/PET
        wind_forcing: no_wind
        bathy: gebco
        river_upa: 5
        use_dfm: False                                      # coastal water level from GTSM time series (coastal_ts)
        use_waves: False
        use_wflow: True
        use_bankfull_corr: False
        skip_coastal_forcing: False                         # ENABLE coastal forcing (GTSM)
        skip_discharge_forcing: True                        # discharge from Wflow coupling
        dfm_res: '100'
        dfm_coastal_mask: coastal_coupling_msk_SMST
        dfm_obs_file: coastal_coupling_DFM_obs_points_SMST
        dfm_verification_points: dfm_verif_points_SMST
        tidemodel: GTSMv41opendap
        coastal_ts: gtsm_codec_reanalysis_hourly_v3         # local GTSM-ERA5 water level reanalysis
        config_sfincs_base: sfincs_base_build_v1.yml
        config_wflow_base: wflow_base_build_v1.yml
        sfincs_obs_file: obs_locs_somerset.geojson
        bbox_sfincs: "[-3.16169,51.06687,-2.867119,51.258058]"
        utmzone: 30u
        CF_value_rain: [0]
        CF_value_wind: [0]
        CF_value_SLR: [0]
