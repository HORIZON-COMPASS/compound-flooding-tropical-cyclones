  rename:
   precipitation: precip    
  meta:
   category: meteo
   paper_doi: 10.1038/sdata.2015.66
   paper_ref: Funk et al (2015)
   source_license: CC BY 4.0
   source_url:  https://doi.org/10.15780/G2JQ0P
   source_version: v3.0
