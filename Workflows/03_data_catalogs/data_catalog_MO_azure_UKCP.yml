  uri: https://saokcu5pj5uokvy02.blob.core.windows.net/default/bucket/forcing/era5_{year}*_daily.nc
  uri_resolver:
    name: azure_blob
    options:
      sas_token: sp=racwdl&st=2026-08-06T11:25:11Z&se=2026-08-12T19:40:11Z&skoid=f7722725-91c9-406d-b28e-a408e8cf1767&sktid=17f18161-20d7-4746-87fd-50fe3e3b6619&skt=2026-08-06T11:25:11Z&ske=2026-08-12T19:40:11Z&sks=b&skv=2026-02-06&spr=https&sv=2026-02-06&sr=c&sig=aCHacaniXGgX7KOfaB6yiEodjbYHeOEANHrbr2RYC64%3D
  provider: azure
  data_type: RasterDataset
  driver:
    name: raster_xarray
    options:
      chunks:
        latitude: 250
        longitude: 240
        time: 30
      combine: by_coords
      decode_times: true
      parallel: true
  metadata:
    crs: 4326
    category: meteo
    notes: Extracted from Copernicus Climate Data Store; resampled by Deltares to
      daily frequency
    paper_doi: 10.1002/qj.3803
    paper_ref: Hersbach et al. (2019)
    source_license: https://cds.climate.copernicus.eu/cdsapp/#!/terms/licence-to-use-copernicus-products
    source_url: https://doi.org/10.24381/cds.bd0915c6
    source_version: ERA5 daily data on pressure levels
  data_adapter:
    unit_mult:
      kin: 0.000277778
      kout: 0.000277778
      press_msl: 0.01
      ssr: 0.000277778
    unit_add:
      temp: -273.15
      temp_dew: -273.15
      temp_max: -273.15
      temp_min: -273.15
    rename:
      d2m: temp_dew
      msl: press_msl
      ssrd: kin
      t2m: temp
      tisr: kout
      tmax: temp_max
      tmin: temp_min
      tp: precip
      u10: wind10_u
      v10: wind10_v
