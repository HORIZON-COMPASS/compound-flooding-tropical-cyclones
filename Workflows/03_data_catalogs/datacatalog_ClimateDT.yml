meta:
  root: p:\
ClimateDT_hist_r1:
  data_type: RasterDataset
  path: 11210471-001-compass/01_Data/ECMWF_ClimateDT/data/preprocessed/Gen2/Idai_full/climateDT_*_hist_r*_Idai_full_20190301_to_20190329.nc
  driver: netcdf
  driver_kwargs:
    chunks:
      latitude: 160
      longitude: 150
      time: 30
    combine: by_coords
    decode_times: true
    parallel: true
  rename:
    msl: press_msl  # Pa
    tp: precip # mm/h
    10u: wind10_u # m/s
    10v: wind10_v # m/s
    ssrd: kin # W/m2
    2t: temp # K
    tisr: kout # W/m2
  unit_mult:
    # kin: 0.000277778    # to convert from J/m2 to W/m2
    # kout: 0.000277778   # to convert from J/m2 to W/m2
    # ssr: 0.000277778    # to convert from J/m2 to W/m2
    press_msl: 0.01 # convert to hPa for wflow
  unit_add:
    temp: -273.15
  meta:
    category: meteo
    notes: ClimateDT data retrieved from Destination Earth
  crs: 4326
